<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#09101E"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C2F5FF"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>

    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00F7FF" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="24" cy="24" r="0.8" fill="#00F7FF" fill-opacity="0.2"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace;
    }
    .font-sans {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    @keyframes scanline {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(360px); }
    }
    .cursor-blink {
      animation: blink 0.9s infinite;
    }
    .pulse-status {
      animation: pulseLed 2s infinite ease-in-out;
      transform-origin: center;
    }
    .scan-bar {
      animation: scanline 7s linear infinite;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="336" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="916" height="336" rx="14" fill="url(#grid)"/>

  <!-- Scanning Sweep Line (SMIL + CSS fallback) -->
  <g opacity="0.8">
    <rect class="scan-bar" x="2" y="0" width="916" height="40" fill="url(#scannerGrad)" pointer-events="none">
      <animate attributeName="y" values="-40;340" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Border Frame -->
  <rect x="2" y="2" width="916" height="336" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 42 L 2 42 Z" fill="#0A1220" fill-opacity="0.9"/>
  <line x1="2" y1="42" x2="918" y2="42" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="22" r="5.5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="42" cy="22" r="5.5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="60" cy="22" r="5.5" fill="#10B981" fill-opacity="0.85"/>

  <!-- Window Title -->
  <text x="84" y="26" class="font-mono" font-size="11.5" fill="#64748B" letter-spacing="0.5">liliustwocout@workstation: ~/neural-core/profile-v4.2</text>

  <!-- System Status Badge (Top Right) -->
  <g transform="translate(685, 12)">
    <rect width="215" height="20" rx="4" fill="#031623" stroke="#00F7FF" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle class="pulse-status" cx="12" cy="10" r="3.5" fill="#00F7FF" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14" class="font-mono" font-size="9.5" fill="#00F7FF" font-weight="600" letter-spacing="0.8">CORE::NODE_ONLINE</text>
    <text x="145" y="14" class="font-mono" font-size="9" fill="#38BDF8" letter-spacing="0.5">EST. 2026</text>
  </g>

  <!-- Cyber Reticle Accents -->
  <path d="M 18 56 L 18 68 M 18 56 L 30 56" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 902 56 L 902 68 M 902 56 L 890 56" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 18 322 L 18 310 M 18 322 L 30 322" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 902 322 L 902 310 M 902 322 L 890 322" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Identity Section -->
  <g transform="translate(36, 68)">
    <!-- Subtitle Tag -->
    <rect x="0" y="0" width="168" height="22" rx="4" fill="url(#badgeGrad)" stroke="#00F7FF" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="10" y="15" class="font-mono" font-size="10" fill="#00F7FF" font-weight="600" letter-spacing="1">SYSTEM INITIALIZED</text>

    <!-- Main Name -->
    <text x="0" y="58" class="font-sans" font-size="34" font-weight="800" fill="url(#cyanText)" letter-spacing="1.5" filter="url(#softGlow)">
      LÊ PHẠM THÀNH ĐẠT
    </text>

    <!-- Roles & Domains -->
    <text x="1" y="84" class="font-mono" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="1.8">
      SYSTEM ENGINEERING  <tspan fill="#64748B">|</tspan>  AI ENGINEERING  <tspan fill="#64748B">|</tspan>  EDGE AI  <tspan fill="#64748B">|</tspan>  FULL-STACK
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="98" x2="848" y2="98" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="98" x2="160" y2="98" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Interactive Terminal Boot Sequence -->
  <g transform="translate(36, 185)">
    <!-- Terminal Background Box -->
    <rect x="0" y="0" width="848" height="96" rx="8" fill="#040812" fill-opacity="0.75" stroke="#13233A" stroke-width="1"/>

    <!-- Terminal Line 1 -->
    <g transform="translate(16, 24)">
      <text class="font-mono" font-size="11.5" fill="#10B981" font-weight="600">[00:00:01]</text>
      <text x="80" y="0" class="font-mono" font-size="11.5" fill="#64748B">BOOT &gt;&gt;</text>
      <text x="140" y="0" class="font-mono" font-size="11.5" fill="#E2E8F0">Initializing AI Environment &amp; Hardware Abstraction Layer...</text>
      <text x="680" y="0" class="font-mono" font-size="11" fill="#10B981" font-weight="bold">[ OK ]</text>
    </g>

    <!-- Terminal Line 2 -->
    <g transform="translate(16, 46)">
      <text class="font-mono" font-size="11.5" fill="#10B981" font-weight="600">[00:00:02]</text>
      <text x="80" y="0" class="font-mono" font-size="11.5" fill="#00F7FF">EDGE &gt;&gt;</text>
      <text x="140" y="0" class="font-mono" font-size="11.5" fill="#94A3B8">Online: ZE03-H2S, MQ136 Gas Sensor Node, ESP32 ADC &amp; RS-485</text>
      <text x="680" y="0" class="font-mono" font-size="11" fill="#00F7FF" font-weight="bold">[ 94.18% ]</text>
    </g>

    <!-- Terminal Line 3 -->
    <g transform="translate(16, 68)">
      <text class="font-mono" font-size="11.5" fill="#10B981" font-weight="600">[00:00:03]</text>
      <text x="80" y="0" class="font-mono" font-size="11.5" fill="#A855F7">MAS  &gt;&gt;</text>
      <text x="140" y="0" class="font-mono" font-size="11.5" fill="#94A3B8">Loaded: Information Diffusion Engine, BDI Personas &amp; Ollama Swarm</text>
      <text x="680" y="0" class="font-mono" font-size="11" fill="#A855F7" font-weight="bold">[ READY ]</text>
    </g>

    <!-- Terminal Prompt / Cursor -->
    <g transform="translate(16, 88)">
      <text class="font-mono" font-size="11.5" fill="#00F7FF" font-weight="600">user@liliustwocout:~$</text>
      <text x="165" y="0" class="font-mono" font-size="11.5" fill="#F8FAFC">ready to engineer intelligent physical systems</text>
      <rect class="cursor-blink" x="480" y="-10" width="8" height="12" fill="#00F7FF">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(36, 298)">
    <!-- Badge 1: Phenikaa University -->
    <rect x="0" y="0" width="185" height="24" rx="4" fill="#08101E" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="3" fill="#38BDF8"/>
    <text x="24" y="16" class="font-mono" font-size="10" fill="#94A3B8">Phenikaa University</text>

    <!-- Badge 2: Vietnam -->
    <rect x="195" y="0" width="105" height="24" rx="4" fill="#08101E" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="207" cy="12" r="3" fill="#10B981"/>
    <text x="219" y="16" class="font-mono" font-size="10" fill="#94A3B8">Vietnam</text>

    <!-- Badge 3: Focus -->
    <rect x="310" y="0" width="220" height="24" rx="4" fill="#08101E" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="322" cy="12" r="3" fill="#00F7FF"/>
    <text x="334" y="16" class="font-mono" font-size="10" fill="#94A3B8">Physical AI &amp; Agent Systems</text>

    <!-- Right-aligned build slogan -->
    <text x="848" y="16" text-anchor="end" class="font-mono" font-size="10" fill="#64748B" letter-spacing="1">
      &gt; BUILD. TRAIN. SHIP.
    </text>
  </g>
</svg>
