<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="ghBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="60%" stop-color="#140924"/>
      <stop offset="100%" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="ghBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: 'Syne', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Button Frame -->
  <rect x="2" y="2" width="236" height="46" rx="8" fill="url(#ghBg)"/>
  <rect x="2" y="2" width="236" height="46" rx="8" fill="none" stroke="url(#ghBorder)" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Traveling Laser Dash -->
  <rect x="2" y="2" width="236" height="46" rx="8" fill="none" stroke="#C084FC" stroke-width="1.6" stroke-dasharray="25 150">
    <animate attributeName="stroke-dashoffset" values="0;-350" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech Corners -->
  <path d="M 6 6 L 6 12 M 6 6 L 12 6" stroke="#A855F7" stroke-width="1.2"/>
  <path d="M 234 6 L 234 12 M 234 6 L 228 6" stroke="#A855F7" stroke-width="1.2"/>
  <path d="M 6 44 L 6 38 M 6 44 L 12 44" stroke="#A855F7" stroke-width="1.2"/>
  <path d="M 234 44 L 234 38 M 234 44 L 228 44" stroke="#A855F7" stroke-width="1.2"/>

  <!-- GitHub Icon -->
  <g transform="translate(16, 14)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M11 1C5.477 1 1 5.477 1 11c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V20c0 .27.16.59.67.5C19.14 19.16 22 15.42 22 11A10 10 0 0 0 11 1z" fill="#E2E8F0"/>
  </g>

  <!-- Labels -->
  <text x="46" y="22" class="font-sans" font-size="12" font-weight="bold" fill="#F8FAFC" letter-spacing="1">GITHUB</text>
  <text x="46" y="36" class="font-mono" font-size="8.5" fill="#94A3B8">@liliustwocout</text>

  <!-- Action Arrow -->
  <text x="220" y="28" text-anchor="end" class="font-mono" font-size="11" font-weight="bold" fill="#C084FC" filter="url(#purpleGlow)">↗</text>
</svg>
