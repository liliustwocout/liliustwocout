<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#030409"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Text Shimmer Gradients -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F7FF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="greenShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mottoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="footerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="#00F7FF" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-display { font-family: 'Syne', 'Unbounded', 'Space Grotesk', 'Rajdhani', -apple-system, sans-serif; }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .prompt-cursor {
      animation: cursorBlink 0.8s infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="176" rx="12" fill="url(#footerBg)"/>
  <rect x="2" y="2" width="916" height="176" rx="12" fill="url(#footerGrid)"/>

  <!-- Glowing Outer Border -->
  <rect x="2" y="2" width="916" height="176" rx="12" fill="none" stroke="url(#footerBorder)" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="0.85;0.35;0.85" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Traveling Laser Dash -->
  <rect x="2" y="2" width="916" height="176" rx="12" fill="none" stroke="#00F7FF" stroke-width="1.8" stroke-dasharray="50 350" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-800" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Reticles -->
  <path d="M 12 12 L 12 22 M 12 12 L 22 12" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 908 12 L 908 22 M 908 12 L 898 12" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 12 168 L 12 158 M 12 168 L 22 168" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 908 168 L 908 158 M 908 168 L 898 168" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top Dispatch Bar -->
  <g transform="translate(28, 22)">
    <text class="font-mono" font-size="9.5" font-weight="bold" fill="#00F7FF" letter-spacing="1">
      // TERMINAL_DISPATCH :: MISSION_DIRECTIVE
    </text>
    <text x="864" y="0" text-anchor="end" class="font-mono" font-size="9" fill="#64748B">
      NODE_STATUS: <tspan fill="#10B981">[AWAITING_COLLABORATION]</tspan>
    </text>
  </g>

  <!-- Divider -->
  <line x1="28" y1="36" x2="892" y2="36" stroke="#162842" stroke-width="1"/>
  <line x1="28" y1="36" x2="160" y2="36" stroke="#00F7FF" stroke-width="1.5"/>

  <!-- ==================== THREE MOTTO LINES (STYLIZED CYBER) ==================== -->
  <g transform="translate(40, 72)">
    <!-- Line 1: BUILD SYSTEMS. -->
    <g transform="translate(0, 0)">
      <text class="font-mono" font-size="20" font-weight="bold" fill="#00F7FF">&gt;</text>
      <text x="24" y="-1" class="font-display" font-size="22" font-weight="900" fill="url(#textShimmer)" letter-spacing="3.5" filter="url(#mottoGlow)">
        BUILD SYSTEMS.
      </text>
    </g>

    <!-- Line 2: TRAIN MODELS. -->
    <g transform="translate(0, 34)">
      <text class="font-mono" font-size="20" font-weight="bold" fill="#38BDF8">&gt;</text>
      <text x="24" y="-1" class="font-display" font-size="22" font-weight="900" fill="url(#textShimmer)" letter-spacing="3.5" filter="url(#mottoGlow)">
        TRAIN MODELS.
      </text>
    </g>

    <!-- Line 3: SHIP INTELLIGENCE. -->
    <g transform="translate(0, 68)">
      <text class="font-mono" font-size="20" font-weight="bold" fill="#10B981">&gt;</text>
      <text x="24" y="-1" class="font-display" font-size="22" font-weight="900" fill="url(#greenShimmer)" letter-spacing="3.5" filter="url(#mottoGlow)">
        SHIP INTELLIGENCE.
      </text>
      <!-- Blinking Terminal Prompt Cursor -->
      <rect class="prompt-cursor" x="345" y="-18" width="10" height="20" fill="#10B981"/>
    </g>
  </g>

  <!-- ==================== EQUALIZER / FREQUENCY BARS (RIGHT SIDE) ==================== -->
  <g transform="translate(730, 80)" opacity="0.85">
    <rect x="-12" y="-10" width="146" height="52" rx="6" fill="#050C17" stroke="#14263C" stroke-width="0.8"/>
    <text x="61" y="-14" text-anchor="middle" class="font-mono" font-size="7.5" fill="#38BDF8">TERMINAL CARRIER [LIVE]</text>

    <!-- 10 dancing equalizer bars -->
    <rect x="0" y="30" width="6" height="4" rx="2" fill="#00F7FF">
      <animate attributeName="height" values="4;26;10;32;4" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;8;24;2;30" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="30" width="6" height="4" rx="2" fill="#38BDF8">
      <animate attributeName="height" values="10;34;8;20;10" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="24;0;26;14;24" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="30" width="6" height="4" rx="2" fill="#818CF8">
      <animate attributeName="height" values="20;8;30;12;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;26;4;22;14" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="30" width="6" height="4" rx="2" fill="#A855F7">
      <animate attributeName="height" values="8;28;14;34;8" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="26;6;20;0;26" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="30" width="6" height="4" rx="2" fill="#00F7FF">
      <animate attributeName="height" values="26;12;34;8;26" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;22;0;26;8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="30" width="6" height="4" rx="2" fill="#38BDF8">
      <animate attributeName="height" values="14;30;10;22;14" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;4;24;12;20" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="30" width="6" height="4" rx="2" fill="#10B981">
      <animate attributeName="height" values="8;22;28;10;8" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="26;12;6;24;26" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="84" y="30" width="6" height="4" rx="2" fill="#00F7FF">
      <animate attributeName="height" values="18;6;24;32;18" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;28;10;2;16" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="30" width="6" height="4" rx="2" fill="#38BDF8">
      <animate attributeName="height" values="12;28;6;20;12" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;6;28;14;22" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="108" y="30" width="6" height="4" rx="2" fill="#10B981">
      <animate attributeName="height" values="6;24;16;30;6" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="28;10;18;4;28" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Left Tech Signature -->
  <g transform="translate(28, 164)">
    <text class="font-mono" font-size="8.5" fill="#64748B">
      CORE SPEC: <tspan fill="#38BDF8">EDGE AI</tspan> · <tspan fill="#A855F7">MULTI-AGENT DIFFUSION</tspan> · <tspan fill="#10B981">FULL-STACK SYSTEMS</tspan>
    </text>
  </g>
</svg>
