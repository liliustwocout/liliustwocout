<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="60%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#03070E"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="edgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Waveform Fill -->
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: 'Syne', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Body -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="url(#edgeBg)"/>

  <!-- Subtle Cyber Tech Grid Inside Card -->
  <g opacity="0.12">
    <line x1="2" y1="50" x2="438" y2="50" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="2" y1="130" x2="438" y2="130" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="2" y1="210" x2="438" y2="210" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="220" y1="2" x2="220" y2="288" stroke="#00F7FF" stroke-width="0.8" stroke-dasharray="2,4"/>
  </g>

  <!-- Glowing Static Border -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="none" stroke="url(#edgeBorder)" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated Traveling Laser Beam along Card Perimeter -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="none" stroke="#00F7FF" stroke-width="2" stroke-dasharray="45 350" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-790" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech Corner Markers -->
  <path d="M 12 12 L 12 22 M 12 12 L 22 12" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 428 12 L 428 22 M 428 12 L 418 12" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 12 278 L 12 268 M 12 278 L 22 278" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 428 278 L 428 268 M 428 278 L 418 278" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Card Header -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="144" height="20" rx="4" fill="#031E2A" stroke="#00F7FF" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="9" cy="10" r="3" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="14" class="font-mono" font-size="9" fill="#00F7FF" font-weight="bold" letter-spacing="0.5">INDUSTRIAL EDGE AI</text>

    <!-- Top-Right Status -->
    <rect x="288" y="0" width="112" height="20" rx="4" fill="#081426" stroke="#162B45" stroke-width="0.8"/>
    <text x="344" y="14" text-anchor="middle" class="font-mono" font-size="9" fill="#38BDF8">ESP32 + RPi 4</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" class="font-sans" font-size="19" font-weight="800" fill="#F8FAFC" letter-spacing="0.6">
      Edge AI Electronic Nose
    </text>
    <text x="0" y="18" class="font-mono" font-size="10.5" fill="#94A3B8">
      H₂S Gas Leakage Detection &amp; Dual-Mode Regression
    </text>
  </g>

  <!-- Waveform HUD with Live Moving Telemetry Dot -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="400" height="68" rx="6" fill="#030813" stroke="#0E1E34" stroke-width="0.8"/>
    
    <!-- Grid -->
    <line x1="0" y1="34" x2="400" y2="34" stroke="#12243A" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="0" x2="100" y2="68" stroke="#12243A" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="0" x2="200" y2="68" stroke="#12243A" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="68" stroke="#12243A" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Waveform Fill Under Curve -->
    <path d="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50 L 390 62 L 10 62 Z" fill="url(#waveFill)"/>

    <!-- Sensor Curve (Savitzky-Golay Response) -->
    <path d="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50" fill="none" stroke="#00F7FF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Animated Data Packet / Telemetry Dot running on wave -->
    <circle r="4.5" fill="#00F7FF" filter="url(#cyanGlow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50"/>
    </circle>

    <!-- Secondary Pulse Trail Dot -->
    <circle r="2.5" fill="#38BDF8">
      <animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50"/>
    </circle>

    <!-- Overlay Telemetry Label -->
    <text x="12" y="16" class="font-mono" font-size="8.5" fill="#38BDF8">ZE03-H2S PULSE RESPONSE</text>
    <text x="388" y="16" text-anchor="end" class="font-mono" font-size="8.5" fill="#10B981">LIVE INFERENCE</text>
  </g>

  <!-- Metrics Grid (3 Key Benchmarks) -->
  <g transform="translate(20, 178)">
    <g transform="translate(0, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#00F7FF">94.18%</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">Pulse Accuracy</text>
    </g>

    <g transform="translate(137, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#38BDF8">0.8534</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">Regression R²</text>
    </g>

    <g transform="translate(274, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#10B981">3.93 ppm</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">MAE Error</text>
    </g>
  </g>

  <!-- Tech Tags Footer -->
  <g transform="translate(20, 244)">
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="29" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">ESP32</text>

    <rect x="66" y="0" width="86" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="109" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">Raspberry Pi</text>

    <rect x="160" y="0" width="62" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="191" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">RS-485</text>

    <rect x="230" y="0" width="94" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="277" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">Random Forest</text>

    <text x="400" y="14" text-anchor="end" class="font-mono" font-size="10" font-weight="bold" fill="#00F7FF">
      EXPLORE →
    </text>
  </g>
</svg>
