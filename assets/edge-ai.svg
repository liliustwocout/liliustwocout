<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C14"/>
      <stop offset="60%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="edgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Signal Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @keyframes pulseCardBorder {
      0%, 100% { stroke-opacity: 0.8; }
      50% { stroke-opacity: 0.35; }
    }
    .border-glow {
      animation: pulseCardBorder 3s infinite ease-in-out;
    }
  </style>

  <!-- Card Body -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="url(#edgeBg)"/>

  <!-- Subtle Cyber Tech Grid Inside Card -->
  <g opacity="0.1">
    <line x1="2" y1="50" x2="438" y2="50" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="2" y1="130" x2="438" y2="130" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="2" y1="210" x2="438" y2="210" stroke="#00F7FF" stroke-width="0.8"/>
    <line x1="220" y1="2" x2="220" y2="288" stroke="#00F7FF" stroke-width="0.8" stroke-dasharray="2,4"/>
  </g>

  <!-- Glowing Border -->
  <rect class="border-glow" x="2" y="2" width="436" height="286" rx="12" fill="none" stroke="url(#edgeBorder)" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.85;0.4;0.85" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech Corner Markers -->
  <path d="M 12 12 L 12 20 M 12 12 L 20 12" stroke="#00F7FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 428 12 L 428 20 M 428 12 L 420 12" stroke="#00F7FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 12 278 L 12 270 M 12 278 L 20 278" stroke="#00F7FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 428 278 L 428 270 M 428 278 L 420 278" stroke="#00F7FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Card Header -->
  <g transform="translate(20, 24)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="138" height="20" rx="4" fill="#031E2A" stroke="#00F7FF" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="8" cy="10" r="3" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="17" y="14" class="font-mono" font-size="9" fill="#00F7FF" font-weight="bold" letter-spacing="0.5">INDUSTRIAL EDGE AI</text>

    <!-- Top-Right Status -->
    <rect x="290" y="0" width="110" height="20" rx="4" fill="#081426" stroke="#1E293B" stroke-width="0.8"/>
    <text x="345" y="14" text-anchor="middle" class="font-mono" font-size="9" fill="#38BDF8">ESP32 + RPi 4</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">
      Edge AI Electronic Nose
    </text>
    <text x="0" y="18" class="font-mono" font-size="10.5" fill="#94A3B8">
      H₂S Gas Leakage Detection &amp; Dual-Mode Regression
    </text>
  </g>

  <!-- Centerpiece: Real-time Gas Sensor Signal Waveform HUD -->
  <g transform="translate(20, 102)">
    <rect x="0" y="0" width="400" height="66" rx="6" fill="#030813" stroke="#0E1E34" stroke-width="0.8"/>
    
    <!-- Grid inside waveform box -->
    <line x1="0" y1="33" x2="400" y2="33" stroke="#162B45" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="0" x2="100" y2="66" stroke="#162B45" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="0" x2="200" y2="66" stroke="#162B45" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="66" stroke="#162B45" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Waveform Fill Under Curve -->
    <path d="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50 L 390 60 L 10 60 Z" fill="url(#waveFill)"/>

    <!-- Sensor Curve (Savitzky-Golay Response) -->
    <path id="sensorPulsePath" d="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Animated Data Packet / Telemetry Dot running on wave -->
    <circle r="4" fill="#00F7FF" filter="url(#dotGlow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 10 52 Q 60 52 90 48 T 150 44 T 190 14 T 230 18 T 270 42 T 330 48 T 390 50"/>
    </circle>

    <!-- Overlay Telemetry Label -->
    <text x="12" y="16" class="font-mono" font-size="8.5" fill="#38BDF8" opacity="0.9">ZE03-H2S PULSE RESPONSE [FILTERED]</text>
    <text x="388" y="16" text-anchor="end" class="font-mono" font-size="8.5" fill="#10B981">LIVE INFERENCE</text>
  </g>

  <!-- Metrics Grid (3 Key Benchmarks) -->
  <g transform="translate(20, 180)">
    <!-- Metric 1: Accuracy -->
    <g transform="translate(0, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#00F7FF">94.18%</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">Pulse Accuracy</text>
    </g>

    <!-- Metric 2: R2 Score -->
    <g transform="translate(137, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#38BDF8">0.8534</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">Regression R²</text>
    </g>

    <!-- Metric 3: MAE -->
    <g transform="translate(274, 0)">
      <rect width="126" height="48" rx="6" fill="#06121E" stroke="#0C253B" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="15" font-weight="bold" fill="#10B981">3.93 ppm</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#94A3B8">MAE Error</text>
    </g>
  </g>

  <!-- Tech Tags Footer -->
  <g transform="translate(20, 244)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="58" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="29" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">ESP32</text>

    <!-- Tag 2 -->
    <rect x="66" y="0" width="86" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="109" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">Raspberry Pi</text>

    <!-- Tag 3 -->
    <rect x="160" y="0" width="62" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="191" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">RS-485</text>

    <!-- Tag 4 -->
    <rect x="230" y="0" width="94" height="20" rx="3" fill="#091424" stroke="#172A45" stroke-width="0.8"/>
    <text x="277" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#7DD3FC">Random Forest</text>

    <!-- View Link Indicator -->
    <text x="400" y="14" text-anchor="end" class="font-mono" font-size="10" font-weight="bold" fill="#00F7FF">
      EXPLORE →
    </text>
  </g>
</svg>
