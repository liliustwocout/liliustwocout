<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="masBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080514"/>
      <stop offset="60%" stop-color="#120A27"/>
      <stop offset="100%" stop-color="#04020B"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="masBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: 'Syne', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Card Body -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="url(#masBg)"/>

  <!-- Subtle Cyber Tech Pattern -->
  <g opacity="0.1">
    <line x1="2" y1="50" x2="438" y2="50" stroke="#A855F7" stroke-width="0.8"/>
    <line x1="2" y1="130" x2="438" y2="130" stroke="#A855F7" stroke-width="0.8"/>
    <line x1="220" y1="2" x2="220" y2="288" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="2,4"/>
  </g>

  <!-- Glowing Static Border -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="none" stroke="url(#masBorder)" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated Traveling Laser Beam along Card Perimeter -->
  <rect x="2" y="2" width="436" height="286" rx="12" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="45 350" stroke-opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-790" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech Corner Markers -->
  <path d="M 12 12 L 12 22 M 12 12 L 22 12" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 428 12 L 428 22 M 428 12 L 418 12" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 12 278 L 12 268 M 12 278 L 22 278" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 428 278 L 428 268 M 428 278 L 418 278" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Card Header -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="144" height="20" rx="4" fill="#200B33" stroke="#A855F7" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="9" cy="10" r="3" fill="#C084FC">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="14" class="font-mono" font-size="9" fill="#E9D5FF" font-weight="bold" letter-spacing="0.5">AI RESEARCH / SWARM</text>

    <!-- Top-Right Status -->
    <rect x="288" y="0" width="112" height="20" rx="4" fill="#130A24" stroke="#2B164A" stroke-width="0.8"/>
    <text x="344" y="14" text-anchor="middle" class="font-mono" font-size="9" fill="#C084FC">Ollama + Qwen</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" class="font-sans" font-size="19" font-weight="800" fill="#F8FAFC" letter-spacing="0.6">
      MAS-Diffusion-Lab
    </text>
    <text x="0" y="18" class="font-mono" font-size="10.5" fill="#C4B5FD">
      LLM Multi-Agent Diffusion &amp; Semantic Drift Research
    </text>
  </g>

  <!-- Centerpiece: Agent Swarm Graph HUD with Radar Pings & Diffusion -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="400" height="68" rx="6" fill="#06030F" stroke="#24153E" stroke-width="0.8"/>

    <!-- Network Connections -->
    <line x1="60" y1="34" x2="140" y2="18" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="60" y1="34" x2="140" y2="50" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="140" y1="18" x2="220" y2="34" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="140" y1="50" x2="220" y2="34" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="220" y1="34" x2="300" y2="20" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="220" y1="34" x2="300" y2="48" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="300" y1="20" x2="350" y2="34" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="300" y1="48" x2="350" y2="34" stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Radar Expanding Rings on Hub Node (220, 34) -->
    <circle cx="220" cy="34" r="8" fill="none" stroke="#00F7FF" stroke-width="1">
      <animate attributeName="r" values="8;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="34" r="6" fill="none" stroke="#A855F7" stroke-width="1">
      <animate attributeName="r" values="6;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Moving Diffusion Packets (Forward Wave) -->
    <circle r="3.5" fill="#00F7FF" filter="url(#purpleGlow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 60 34 L 140 18 L 220 34 L 300 20 L 350 34"/>
    </circle>
    <circle r="3" fill="#C084FC" filter="url(#purpleGlow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 60 34 L 140 50 L 220 34 L 300 48 L 350 34"/>
    </circle>

    <!-- Feedback Echo Packet (Reverse Wave) -->
    <circle r="2.5" fill="#38BDF8">
      <animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M 350 34 L 300 20 L 220 34 L 140 18 L 60 34"/>
    </circle>

    <!-- Agent Nodes -->
    <g transform="translate(60, 34)">
      <circle r="7" fill="#2E1065" stroke="#A855F7" stroke-width="1.5"/>
      <circle r="3" fill="#C084FC"/>
      <text y="-10" text-anchor="middle" class="font-mono" font-size="7.5" fill="#A855F7">Seed</text>
    </g>

    <g transform="translate(140, 18)">
      <circle r="5" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    </g>
    <g transform="translate(140, 50)">
      <circle r="5" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    </g>

    <g transform="translate(220, 34)">
      <circle r="9" fill="#3B0764" stroke="#00F7FF" stroke-width="1.6" filter="url(#purpleGlow)"/>
      <circle r="4" fill="#00F7FF"/>
      <text y="-12" text-anchor="middle" class="font-mono" font-size="8" font-weight="bold" fill="#00F7FF">Hub Agent</text>
    </g>

    <g transform="translate(300, 20)">
      <circle r="5" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
    </g>
    <g transform="translate(300, 48)">
      <circle r="5" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
    </g>

    <g transform="translate(350, 34)">
      <circle r="7" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5"/>
      <circle r="3" fill="#E879F9"/>
      <text y="-10" text-anchor="middle" class="font-mono" font-size="7.5" fill="#E879F9">Consensus</text>
    </g>

    <text x="12" y="15" class="font-mono" font-size="8" fill="#A855F7">NETWORK TOPOLOGY: SCALE-FREE (BA)</text>
    <text x="388" y="15" text-anchor="end" class="font-mono" font-size="8" fill="#00F7FF">DIFFUSION: ACTIVE</text>
  </g>

  <!-- Metrics Grid (3 Key Benchmarks) -->
  <g transform="translate(20, 178)">
    <g transform="translate(0, 0)">
      <rect width="126" height="48" rx="6" fill="#100A24" stroke="#251648" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="14.5" font-weight="bold" fill="#C084FC">2100+ tok/s</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#A5B4FC">Prompt Ingestion</text>
    </g>

    <g transform="translate(137, 0)">
      <rect width="126" height="48" rx="6" fill="#100A24" stroke="#251648" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="14.5" font-weight="bold" fill="#00F7FF">58–65 tok/s</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#A5B4FC">Qwen Generation</text>
    </g>

    <g transform="translate(274, 0)">
      <rect width="126" height="48" rx="6" fill="#100A24" stroke="#251648" stroke-width="0.8"/>
      <text x="12" y="22" class="font-mono" font-size="14.5" font-weight="bold" fill="#38BDF8">BDI Swarm</text>
      <text x="12" y="38" class="font-mono" font-size="8" fill="#A5B4FC">Semantic Drift</text>
    </g>
  </g>

  <!-- Tech Tags Footer -->
  <g transform="translate(20, 244)">
    <rect x="0" y="0" width="80" height="20" rx="3" fill="#150C2E" stroke="#2D1A5E" stroke-width="0.8"/>
    <text x="40" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#DDD6FE">Multi-Agent</text>

    <rect x="88" y="0" width="60" height="20" rx="3" fill="#150C2E" stroke="#2D1A5E" stroke-width="0.8"/>
    <text x="118" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#DDD6FE">Ollama</text>

    <rect x="156" y="0" width="70" height="20" rx="3" fill="#150C2E" stroke="#2D1A5E" stroke-width="0.8"/>
    <text x="191" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#DDD6FE">Qwen 2.5</text>

    <rect x="234" y="0" width="90" height="20" rx="3" fill="#150C2E" stroke="#2D1A5E" stroke-width="0.8"/>
    <text x="279" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#DDD6FE">Network Sci</text>

    <text x="400" y="14" text-anchor="end" class="font-mono" font-size="10" font-weight="bold" fill="#C084FC">
      RESEARCH →
    </text>
  </g>
</svg>
